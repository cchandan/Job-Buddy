{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="panel panel--center">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="actions">
    {% if retry %}<a href="javascript:history.back()" class="btn">Go back and retry</a>{% endif %}
    <a href="/" class="btn btn--ghost">Home</a>
  </div>
</div>
{% endblock %}
