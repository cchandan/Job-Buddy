<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2536e8">
  <title>Sign in · Job Buddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232536e8'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='Arial' font-weight='800' font-size='15' fill='%23c9f23c'%3EJB%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/app.css?v=4">
</head>
<body class="app login">
<main class="card">
  <div>
    <h1 class="t" style="font-size: 34px">Job Buddy</h1>
    <p class="sub" style="font-size: 16px; margin-top: 8px">Welcome back. Find jobs, track your applications and stay ahead of every deadline, together.</p>
  </div>
  {% if error %}<div class="flash flash--bad" role="alert">{{ error }}</div>{% endif %}
  {% if flash %}<div class="flash {{ 'flash--bad' if flash[0] == 'bad' }}" role="status">{{ flash[1] }}</div>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field"><label class="lab" for="username">Username</label>
      <input id="username" name="username" class="input" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus value="{{ username }}"></div>
    <div class="field"><label class="lab" for="password">Password</label>
      <div class="pw">
        <input id="password" name="password" type="password" class="input" autocomplete="current-password" required>
        <button type="button" class="btn" id="show" aria-pressed="false">Show</button>
      </div></div>
    <button class="btn btn--primary" style="min-height: 52px; font-size: 16px">Sign in</button>
  </form>
  <p class="by">Forgotten your password? Ask an admin for a new one. Job Buddy is private: accounts are created by an admin.</p>
</main>
<script>
  var show = document.getElementById("show"), pw = document.getElementById("password");
  show.addEventListener("click", function () {
    var on = pw.type === "password";
    pw.type = on ? "text" : "password";
    show.textContent = on ? "Hide" : "Show";
    show.setAttribute("aria-pressed", on);
  });
</script>
</body>
</html>
