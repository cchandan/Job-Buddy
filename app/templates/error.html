{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto mt-16 text-center bg-white border border-slate-200 rounded-xl p-8">
  <h1 class="text-xl font-semibold">{{ title }}</h1>
  <p class="mt-2 text-slate-600">{{ message }}</p>
  <div class="mt-6 flex justify-center gap-3">
    {% if retry %}<a href="javascript:history.back()" class="px-4 py-2 rounded-lg bg-indigo-600 text-white text-sm">Go back and retry</a>{% endif %}
    <a href="/" class="px-4 py-2 rounded-lg border border-slate-300 text-sm">Home</a>
  </div>
</div>
{% endblock %}
