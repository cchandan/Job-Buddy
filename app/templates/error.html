{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card empty">
  <h1 class="t">{{ title }}</h1>
  <p class="sub">{{ message }}</p>
  <div class="rowx">
    {% if retry %}<a href="javascript:history.back()" class="btn">Go back and try again</a>{% endif %}
    <a href="/" class="btn btn--primary">{{ "Home" if person else "Sign in" }}</a>
  </div>
</div>
{% endblock %}
